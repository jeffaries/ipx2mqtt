# Exemple : ipx2mqtt + Mosquitto.
# Toute la configuration vient des deux fichiers YAML du dossier ./config (config.yml et entities.yml).
# Si vous avez déjà un broker Mosquitto, supprimez le service "mosquitto" et
# renseignez Mqtt.Host dans config/config.yml.

services:
  ipx2mqtt:
    build: .
    image: ipx2mqtt:latest
    container_name: ipx2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      # Toute la configuration : ./config/config.yml (MQTT, IPX, appareil) et ./config/entities.yml (entités, libellés)
      - ./config:/config:ro
    # ports:
    #   - "8080:8080"   # uniquement si Push.Enabled=true dans config.yml

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

volumes:
  mosquitto-data:
