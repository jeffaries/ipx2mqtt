# Exemple : ipx2mqtt + Mosquitto.
# Toute la configuration vient des deux fichiers YAML du dossier ./config (config.yml et entities.yml).
# Si vous avez déjà un broker Mosquitto, supprimez le service "mosquitto" et
# renseignez Mqtt.Host dans config/config.yml.

services:
  ipx2mqtt:
    build: .
    pull_policy: build
    image: ipx2mqtt:latest
    container_name: ipx2mqtt
    restart: unless-stopped
    volumes:
      # Toute la configuration : config.yml (MQTT, IPX, appareil) et entities.yml (entités, libellés).
      # Pas en :ro : l'interface web les modifie (le dossier doit être accessible en écriture à l'utilisateur du conteneur).
      - /data/ipx2mqtt:/config
    ports:
      - "8080:8080"   # interface web de configuration (Web.Port ; protégez-la avec Web.Password dans config.yml)

 
