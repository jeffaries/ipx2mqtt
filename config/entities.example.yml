# Exemple documenté de entities.yml : copiez ce fichier vers config/entities.yml et adaptez-le.
# Le dossier config/ est monté dans le conteneur sur /config (voir docker-compose.yml).
#
# Tout se trouve dans la liste "Entities", qui contient deux sortes d'entrées :
#   - avec "Key"  : personnalise un canal découvert automatiquement (Ipx.AutoDiscover: true dans config.yml)
#   - sans "Key"  : déclare une entité à la main, prioritaire sur la découverte automatique

# ---------------------------------------------------------------------------------------------------------------------
# Ce qui est découvert (par défaut) :
#   [01-IPX] relais de la carte        -> switch  (topics relay/<n>)
#   [IPX] Open coll. n                 -> switch  (collector/<n>)
#   [NN-8R]  relais X-8R               -> switch  (<NN>-8r/<n>)
#   [NN-DM]  variateur X-DIMMER        -> light   (<NN>-dm/<n>) : marche + niveau 0-100
#   [NN-DM]  On/Off All                -> switch  (<NN>-dm-all/1)
#   X-010V, X-PWM, X-400               -> number  (sorties analogiques, 0-100)
#
# Personnaliser un canal découvert (entrée avec Key) :
#   Key        code module "<module>.<canal>" : l'objet IPX "[04-8R]Relay cmd 5" donne "04-8R.05", "[06-DM]On/Off 3" donne
#              "06-DM.03", "[01-IPX]Relay cmd 1" donne "01-IPX.01". Ou _id numérique de l'objet de commande ("65536"),
#              indépendant des noms d'objets, prioritaire sur le code module. Mettre la clé entre guillemets.
#   Name       nom affiché dans Home Assistant (défaut : nom générique, « 03-8R relais 3 »). Renommer ne recrée pas l'entité.
#   Area       pièce de l'entité ("Cuisine"). Valable aussi pour une entité déclarée à la main (voir plus bas).
#              Home Assistant n'a pas de pièce par entité dans MQTT Discovery, seulement par appareil : les entités d'une
#              même pièce sont donc regroupées dans un appareil « IPX800 V5 - <pièce> » (suggested_area, rattaché à l'appareil
#              principal). Sans Area, l'entité reste dans l'appareil principal. La pièce n'est suggérée qu'à la création de
#              l'appareil : si vous la changez ensuite, modifiez-la aussi dans Home Assistant.
#   Component  switch | light. Défaut : switch pour un relais, light pour un variateur.
#   Dimmable   light uniquement. true (défaut) = lumière variable (on/off + curseur de niveau) ; false = lumière on/off.
#              Seul un variateur [NN-DM] a un niveau : un relais montré en light est toujours on/off.
#
# Combinaisons utiles :
#   relais    -> switch                    (défaut)
#   relais    -> light on/off              Component: light
#   variateur -> light variable            (défaut)
#   variateur -> light on/off              Dimmable: false
#   variateur -> switch                    Component: switch
# Changer Component change la plateforme Home Assistant : l'entité est recréée (nouvel entity_id, historique perdu).
# ---------------------------------------------------------------------------------------------------------------------
Entities:
  - { Key: "01-IPX.01", Name: Lumières Cuisine, Area: Cuisine }                     # renommer + pièce
  - { Key: "03-8R.02",  Name: Lumières Bureau, Component: light }                   # relais présenté comme lumière on/off
  - { Key: "04-8R.05",  Name: Z3 1er Etage }
  - { Key: "06-DM.01",  Name: Lumières Salle à manger }                             # variateur : light variable
  - { Key: "06-DM.02",  Name: Spots salon, Component: light, Dimmable: false }      # variateur utilisé comme light on/off
  - { Key: "65537",     Name: Lumières Palier }                                     # par _id de "[01-IPX]Relay cmd 2"

# ---------------------------------------------------------------------------------------------------------------------
# Entités déclarées à la main (sans Key). Une entité découverte qui utilise les mêmes identifiants IPX est ignorée.
#
# Champs communs :
#   Type       (obligatoire) libellé utilisé dans les topics : lettres, chiffres, "_" et "-" (relay, input, analog...)
#   Index      numéro dans les topics ipx800/<Type>/<Index>/state ; défaut : StateId (sinon CommandId)
#   Name       (obligatoire) nom affiché dans Home Assistant
#   Component  (obligatoire) switch | binary_sensor | sensor | light | number
#   StateId    objet IPX qui porte l'état (io ou ana)
#   CommandId  objet IPX à écrire pour commander
#   DeviceClass, Icon   classe d'appareil / icône Home Assistant (optionnels)
#
# Trouver les identifiants "_id" : GET http://<ipx>/api/core/io et /api/core/ana (voir le README).
# Sur l'IPX V5 la commande et l'état d'un relais sont deux objets : "Relay cmd 1" (commande) et "Relay state 1" (état).
# ---------------------------------------------------------------------------------------------------------------------
  # switch : relais. CommandId obligatoire ; sans StateId, l'état est lu sur CommandId.
  - Type: relay
    Index: 1
    Name: Éclairage garage
    Component: switch
    StateId: 65544            # [01-IPX]Relay state 1
    CommandId: 65536          # [01-IPX]Relay cmd 1

  # binary_sensor : entrée numérique. StateId obligatoire. Invert: true inverse ON/OFF.
  - Type: input
    Index: 1
    Name: Porte garage
    Component: binary_sensor
    StateId: 65552            # [01-IPX]Digital input 1
    DeviceClass: door
    Invert: false

  # sensor : valeur analogique (lecture seule). StateId obligatoire.
  #   Unit, StateClass (measurement, total...), Decimals = nombre de décimales publiées
  - Type: analog
    Index: 1
    Name: Température cave
    Component: sensor
    StateId: 262153           # [IPX]Analog input 1
    Unit: "°C"
    DeviceClass: temperature
    StateClass: measurement
    Decimals: 1

  # light : variateur. CommandId = objet On/Off. Optionnel : niveau 0-100 avec
  #   BrightnessCommandId (objet "Consign", niveau demandé) et BrightnessStateId (objet "Position", niveau réel).
  - Type: dimmer
    Index: 1
    Name: Salon
    Component: light
    StateId: 65587            # [06-DM]On/Off 1
    CommandId: 65587
    BrightnessCommandId: 262194   # [06-DM]Consign 1
    BrightnessStateId: 196617     # [06-DM]Position 1

  # number : curseur sur un objet analogique réglable. CommandId obligatoire.
  #   Min et Max (défauts 0 et 100) bornent les valeurs acceptées ; Unit, Decimals optionnels.
  - Type: pwm
    Index: 1
    Name: Sortie PWM 1
    Component: number
    StateId: 262400
    CommandId: 262400
    Min: 0
    Max: 100
    Unit: "%"
